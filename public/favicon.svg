<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="55%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="starBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <!-- Rounded app icon backdrop -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#bgGrad)" />

  <!-- Friendly 5-point star mascot -->
  <path
    d="M 60 14
       C 62 14, 65 21, 72 35
       C 76 42, 83 44, 97 46
       C 104 47, 106 51, 101 57
       C 91 67, 88 73, 92 87
       C 94 94, 90 97, 84 93
       C 72 86, 66 85, 60 89
       C 54 85, 48 86, 36 93
       C 30 97, 26 94, 28 87
       C 32 73, 29 67, 19 57
       C 14 51, 16 47, 23 46
       C 37 44, 44 42, 48 35
       C 55 21, 58 14, 60 14 Z"
    fill="url(#starBodyGrad)"
    stroke="#92400E"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Red-White Headband -->
  <path d="M 45 31 C 55 27, 65 27, 75 31 L 74 37 C 64 33, 56 33, 46 37 Z" fill="#DC2626" />
  <path d="M 46 35 C 55 32, 65 32, 74 35 L 74 37 C 65 34, 55 34, 46 37 Z" fill="#FFFFFF" />

  <!-- Eyes -->
  <ellipse cx="48" cy="54" rx="4.8" ry="6.5" fill="#1E293B" />
  <circle cx="46.5" cy="51.5" r="2.2" fill="#FFFFFF" />
  <ellipse cx="72" cy="54" rx="4.8" ry="6.5" fill="#1E293B" />
  <circle cx="70.5" cy="51.5" r="2.2" fill="#FFFFFF" />

  <!-- Smile -->
  <path
    d="M 52 63 C 54 71, 66 71, 68 63"
    fill="#B91C1C"
    stroke="#92400E"
    stroke-width="2"
    stroke-linecap="round"
  />
</svg>
